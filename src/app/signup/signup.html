<div class="login-container">
  <div class="boy-side"></div>
  <div class="girl-side"></div>
  <div class="login-form">
    <h2><i>Create Account</i></h2>
    <form [formGroup]="signupForm" (ngSubmit)="signup()">
      <div class="input-group">
        <label for="name">Name</label>
        <input type="text" id="name" formControlName="name">
      </div>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email">
        @if (signupForm.get('email')?.hasError('email') && signupForm.get('email')?.touched) {
          <div class="error-message">Please enter a valid email address.</div>
        }
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password">
      </div>
      <button type="submit" [disabled]="!signupForm.valid" [style.background]="'linear-gradient(to right, #0072ff, #ff9a9e)'">Sign Up</button>
      <div class="create-account">
        <a href="/login">Already have an account? Login</a>
      </div>
    </form>
  </div>
</div>
