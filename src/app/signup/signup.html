<div class="signup-container">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Sign Up</h2>
      <p class="card-description">Enter your information to create an account</p>
    </div>
    <div class="card-content">
      <form [formGroup]="signupForm" (ngSubmit)="signup()">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" formControlName="name" placeholder="Your Name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" formControlName="email" placeholder="m@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" formControlName="password">
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="!signupForm.valid">Create an account</button>
      </form>
      <div class="footer-text">
        Already have an account? 
        <a href="/login">Log in</a>
      </div>
    </div>
  </div>
</div>
