<div class="signup-container">
  <div class="logo" (click)="goHome()">
    <span class="logo-icon">♥</span>
    <span class="logo-text">Translator</span>
  </div>
  <div class="boy-side">
    <div class="boy-content">
      <h2>Boys</h2>
      <p>What they really mean</p>
    </div>
  </div>
  <div class="form-side">
    <div class="card">
      <div class="card-header">
        <div class="heart-icon">♥</div>
        <h2 class="card-title">Sign Up</h2>
        <p class="card-description">Enter your information to create an account</p>
      </div>
      <div class="card-content">
        <form [formGroup]="signupForm" (ngSubmit)="signup()">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" formControlName="name" placeholder="Your Name">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" formControlName="email" placeholder="m@example.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" formControlName="password">
          </div>
          <button type="submit" class="btn btn-primary" [disabled]="!signupForm.valid">Create an account</button>
        </form>
        <div class="divider">
          <span>Or continue with</span>
        </div>
        <button type="button" class="btn btn-google" (click)="signInWithGoogle()">
          <img src="https://www.google.com/favicon.ico" alt="Google" class="google-icon">
          Sign up with Google
        </button>
        <div class="footer-text">
          Already have an account? 
          <a href="/login">Log in</a>
        </div>
      </div>
    </div>
  </div>
  <div class="girl-side">
    <div class="girl-content">
      <h2>Girls</h2>
      <p>What they really mean</p>
    </div>
  </div>
</div>
