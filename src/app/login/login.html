<div class="login-container">
  <div class="boy-side">
    <div class="boy-content">
      <h2>Boys</h2>
      <p>What they really mean</p>
    </div>
  </div>
  <div class="form-side">
    <div class="card">
      <div class="card-header">
        <div class="heart-icon">♥</div>
        <h2 class="card-title">Login</h2>
        <p class="card-description">Enter your email below to login to your account</p>
      </div>
      <div class="card-content">
        @if (error) {
          <div class="error-alert">
            <p>{{ error }}</p>
          </div>
        }
        <form [formGroup]="loginForm" (ngSubmit)="login()">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" formControlName="email" placeholder="m@example.com">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" formControlName="password">
          </div>
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <div class="footer-text">
          Don't have an account? 
          <a href="/signup">Sign up</a>
        </div>
      </div>
    </div>
  </div>
  <div class="girl-side">
    <div class="girl-content">
      <h2>Girls</h2>
      <p>What they really mean</p>
    </div>
  </div>
</div>
