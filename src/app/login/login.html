<div class="login-container">
  <div class="boy-side"></div>
  <div class="girl-side"></div>
  <div class="login-form">
    <h2><i>Translator</i></h2>
    <form>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" [style.background]="'linear-gradient(to right, #0072ff, #ff9a9e)'">Login</button>
      <div class="create-account">
        <a href="/signup">Don't have an account? Create one</a>
      </div>
    </form>
  </div>
</div>
